<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📋 주간 업무</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; background: #f8fafc; color: #1e293b; }
    button, input, select, textarea { font-family: inherit; }
    .wrap { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .header h1 { font-size: 18px; font-weight: 700; color: #111827; }
    .btn-nav { border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 6px; padding: 3px 10px; cursor: pointer; color: #6b7280; font-size: 13px; }
    .btn-today { margin-left: auto; border: none; background: #eef2ff; color: #6366f1; font-weight: 600; font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
    .week-label { font-size: 14px; font-weight: 600; color: #374151; }
    .day-card { border: 1.5px solid #e5e7eb; border-radius: 10px; background: #fff; margin-bottom: 10px; }
    .day-card.today { border-color: #6366f1; }
    .day-card.dragover { border-color: #6366f1; background: #f5f3ff; }
    .day-card.disabled { opacity: 0.5; pointer-events: none; }
    .day-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f9fafb; border-radius: 8px 8px 0 0; border-bottom: 1px solid #e5e7eb; pointer-events: auto; }
    .day-header.today-hdr { background: #6366f1; }
    .day-title { font-size: 13px; font-weight: 700; color: #374151; }
    .today-hdr .day-title { color: #fff; }
    .day-badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: #eef2ff; color: #6366f1; }
    .today-hdr .day-badge { background: rgba(255,255,255,0.2); color: #fff; }
    .day-off-badge { font-size: 11px; font-weight: 600; color: #9ca3af; margin-left: 4px; }
    .today-hdr .day-off-badge { color: rgba(255,255,255,0.8); }
    .vacation-btn { font-size: 10px; font-weight: 600; border: 1px solid #e5e7eb; background: transparent; color: #9ca3af; border-radius: 5px; padding: 2px 7px; cursor: pointer; margin-left: auto; pointer-events: auto; }
    .today-hdr .vacation-btn { border-color: rgba(255,255,255,0.4); color: #fff; }
    .vacation-input { font-size: 11px; border: none; border-bottom: 1px solid #e5e7eb; outline: none; background: transparent; color: #6b7280; width: 80px; margin-left: auto; pointer-events: auto; }
    .carried-section { border-bottom: 1px solid #e5e7eb; }
    .carried-header { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #fffbeb; border-bottom: 1px solid #fde68a; }
    .carried-header span { font-size: 11px; font-weight: 600; color: #f59e0b; }
    .carried-task { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 34px; background: #fffdf0; border-bottom: 1px solid #fef3c7; cursor: grab; }
    .carried-task:hover { background: #fef9e7; }
    .carried-from { font-size: 10px; color: #9ca3af; white-space: nowrap; }
    .carried-memo { padding: 0 12px 4px 12px; background: #fffdf0; border-bottom: 1px solid #fef3c7; }
    .carried-memo input { width: 100%; border: none; border-bottom: 1px solid #fde68a; outline: none; font-size: 12px; color: #6b7280; background: transparent; padding: 2px 0; }
    .task-row { border-bottom: 1px solid #f8fafc; }
    .task-main { display: flex; align-items: center; gap: 8px; padding: 7px 12px; min-height: 38px; }
    .task-main:hover { background: #fafafa; }
    .drag-handle { color: #cbd5e1; font-size: 12px; cursor: grab; flex-shrink: 0; }
    .task-product { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #f1f5f9; color: #475569; white-space: nowrap; }
    .task-from { font-size: 10px; color: #9ca3af; white-space: nowrap; }
    .task-text { flex: 1; font-size: 13px; color: #1e293b; cursor: text; word-break: break-all; }
    .task-text.done { text-decoration: line-through; color: #9ca3af; }
    .del-btn { background: none; border: none; cursor: pointer; color: #e2e8f0; font-size: 13px; padding: 0 2px; flex-shrink: 0; }
    .del-btn:hover { color: #94a3b8; }
    .task-memo { padding: 0 12px 4px 44px; }
    .task-memo input { width: 100%; border: none; border-bottom: 1px solid #f1f5f9; outline: none; font-size: 12px; color: #6b7280; background: transparent; padding: 2px 0; }
    .subtasks { padding: 0 12px 6px 44px; }
    .sub-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; min-height: 26px; }
    .sub-sym { color: #d1d5db; font-size: 11px; flex-shrink: 0; }
    .sub-text { font-size: 12px; flex: 1; color: #374151; }
    .sub-text.done { text-decoration: line-through; color: #9ca3af; }
    .add-sub-btn { background: none; border: none; cursor: pointer; font-size: 11px; color: #9ca3af; padding: 2px 0; }
    .add-sub-btn:hover { color: #6366f1; }
    .pill-wrap { position: relative; }
    .status-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; cursor: pointer; white-space: nowrap; border: none; }
    .status-menu { position: fixed; z-index: 9999; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); min-width: 90px; padding: 4px 0; }
    .status-item { padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .status-item:hover { opacity: 0.85; }
    .add-row-btn { display: block; width: 100%; text-align: left; padding: 7px 12px 7px 14px; font-size: 12px; color: #9ca3af; cursor: pointer; background: none; border: none; border-radius: 0 0 8px 8px; }
    .add-row-btn:hover { background: #f9fafb; }
    .add-form { display: none; align-items: center; gap: 8px; padding: 6px 10px; background: #fafaff; border-top: 1px solid #f1f5f9; }
    .add-form.open { display: flex; }
    .add-form input { flex: 1; border: none; outline: none; font-size: 13px; color: #374151; background: transparent; }
    .add-form select { font-size: 11px; border: 1px solid #e5e7eb; border-radius: 5px; padding: 2px 4px; color: #374151; outline: none; cursor: pointer; }
    .cancel-btn { background: none; border: none; color: #d1d5db; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📋 주간 업무</h1>
    <button class="btn-nav" id="prevBtn">←</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="btn-nav" id="nextBtn">→</button>
    <button class="btn-today" id="todayBtn">이번 주</button>
  </div>
  <div id="board"></div>
</div>
<script>
const STATUS = {
  todo:       { label: "예정",   color: "#6b7280", bg: "#f3f4f6" },
  inprogress: { label: "진행중", color: "#6366f1", bg: "#eef2ff" },
  done:       { label: "완료",   color: "#22c55e", bg: "#f0fdf4" },
  hold:       { label: "보류",   color: "#f59e0b", bg: "#fffbeb" },
};
const DAY_LABELS = ["월","화","수","목","금"];
let _id = Date.now();
const uid = () => String(++_id);
const toKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayKey = () => toKey(new Date());

function getWeekDays(base) {
  const d = new Date(base + "T00:00:00"), mon = new Date(d);
  mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return Array.from({length: 5}, (_, i) => {
    const dd = new Date(mon); dd.setDate(mon.getDate() + i); return toKey(dd);
  });
}

function loadData() { try { return JSON.parse(localStorage.getItem("wj_v2") || "{}"); } catch { return {}; } }
function saveData(d) { try { localStorage.setItem("wj_v2", JSON.stringify(d)); } catch {} }

let data = loadData();
let weekBase = todayKey();
let dragTaskId = null, dragFromDk = null;
let openMenu = null;

function carryOver() {
  const tk = todayKey();
  Object.entries(data).forEach(([dk, day]) => {
    if (dk >= tk) return;
    const tasks = day.tasks || [];
    const incomplete = tasks.filter(t => t.status !== "done" && t.status !== "hold" && !t._carried);
    if (!incomplete.length) return;
    const todayDay = data[tk] || { tasks: [], memo: "" };
    const alreadyCarried = todayDay.tasks.filter(t => t._carried && incomplete.some(o => o.text === t.text));
    if (!alreadyCarried.length) {
      const carried = incomplete.map(t => ({...t, id: uid(), _carried: true, _from: dk}));
      data[dk] = {...day, tasks: tasks.map(t => incomplete.find(i => i.id === t.id) ? {...t, _carried: true} : t)};
      data[tk] = {...todayDay, tasks: [...carried, ...todayDay.tasks]};
    }
  });
  saveData(data);
}

function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener("click", closeMenu);

function makeStatusPill(status, onChange) {
  const wrap = document.createElement("div");
  wrap.className = "pill-wrap";
  const s = STATUS[status || "todo"];
  const btn = document.createElement("button");
  btn.className = "status-pill";
  btn.style.background = s.bg;
  btn.style.color = s.color;
  btn.textContent = s.label + " ▾";
  btn.addEventListener("click", e => {
    e.stopPropagation();
    closeMenu();
    const menu = document.createElement("div");
    menu.className = "status-menu";
    Object.entries(STATUS).forEach(([k, v]) => {
      const item = document.createElement("div");
      item.className = "status-item";
      item.style.color = v.color;
      item.style.background = status === k ? v.bg : "";
      item.textContent = v.label;
      item.addEventListener("click", ev => {
        ev.stopPropagation();
        onChange(k);
        btn.style.background = STATUS[k].bg;
        btn.style.color = STATUS[k].color;
        btn.textContent = STATUS[k].label + " ▾";
        status = k;
        closeMenu();
      });
      menu.appendChild(item);
    });
    const rect = btn.getBoundingClientRect();
    menu.style.top = (rect.bottom + 4) + "px";
    menu.style.left = rect.left + "px";
    document.body.appendChild(menu);
    openMenu = menu;
  });
  wrap.appendChild(btn);
  return wrap;
}

function makeSubtasks(dk, task) {
  const wrap = document.createElement("div");
  wrap.className = "subtasks";
  task.subs = task.subs || [];
  function renderSubs() {
    wrap.innerHTML = "";
    task.subs.forEach(s => {
      const row = document.createElement("div");
      row.className = "sub-row";
      const sym = document.createElement("span"); sym.className = "sub-sym"; sym.textContent = "└";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = s.done;
      cb.style.cssText = "width:12px;height:12px;cursor:pointer;accent-color:#6366f1;flex-shrink:0";
      cb.addEventListener("change", () => { s.done = cb.checked; saveData(data); renderSubs(); });
      const txt = document.createElement("span");
      txt.className = "sub-text" + (s.done ? " done" : "");
      txt.textContent = s.text;
      const del = document.createElement("button"); del.className = "del-btn"; del.textContent = "✕";
      del.addEventListener("click", () => { task.subs = task.subs.filter(x => x.id !== s.id); saveData(data); renderSubs(); });
      row.appendChild(sym); row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
      wrap.appendChild(row);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "add-sub-btn"; addBtn.textContent = "+ 하위 업무";
    addBtn.addEventListener("click", () => {
      const inp = document.createElement("input");
      inp.placeholder = "하위 업무 입력...";
      inp.style.cssText = "border:none;border-bottom:1px solid #e5e7eb;outline:none;font-size:12px;font-family:inherit;color:#374151;background:transparent;padding:1px 0;width:200px;margin-left:18px";
      addBtn.replaceWith(inp); inp.focus();
      const commit = () => {
        const t2 = inp.value.trim();
        if (t2) { task.subs.push({id: uid(), text: t2, done: false}); saveData(data); }
        renderSubs();
      };
      inp.addEventListener("blur", commit);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } if (e.key === "Escape") renderSubs(); });
    });
    wrap.appendChild(addBtn);
  }
  renderSubs();
  return wrap;
}

function makeCarriedSection(dk, carriedTasks) {
  if (!carriedTasks.length) return null;
  const section = document.createElement("div");
  section.className = "carried-section";
  const hdr = document.createElement("div");
  hdr.className = "carried-header";
  hdr.innerHTML = "<span>🔄 이어서 진행 중</span>";
  section.appendChild(hdr);

  carriedTasks.forEach(t => {
    const row = document.createElement("div");
    row.className = "carried-task";
    row.draggable = true;
    row.addEventListener("dragstart", () => { dragTaskId = t.id; dragFromDk = dk; });
    row.addEventListener("dragend", () => { dragTaskId = null; dragFromDk = null; });

    const handle = document.createElement("span");
    handle.className = "drag-handle"; handle.textContent = "⋮⋮";

    const prodEl = document.createElement("span");
    prodEl.className = "task-product"; prodEl.textContent = t.product || "";
    prodEl.style.display = t.product ? "" : "none";

    const fromEl = document.createElement("span");
    fromEl.className = "carried-from";
    fromEl.textContent = t._from ? t._from.slice(5).replace("-", "/") : "";

    const textEl = document.createElement("span");
    textEl.className = "task-text"; textEl.style.flex = "1"; textEl.textContent = t.text;
    textEl.title = "더블클릭으로 수정";
    textEl.addEventListener("dblclick", () => {
      textEl.contentEditable = "true"; textEl.focus();
      const finish = () => {
        textEl.contentEditable = "false";
        const v = textEl.textContent.trim();
        if (v) { t.text = v; saveData(data); } else textEl.textContent = t.text;
      };
      textEl.addEventListener("blur", finish, {once: true});
      textEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); textEl.blur(); } }, {once: true});
    });

    const pill = makeStatusPill(t.status, v => { t.status = v; saveData(data); });

    row.appendChild(handle);
    if (t.product) row.appendChild(prodEl);
    row.appendChild(fromEl);
    row.appendChild(textEl);
    row.appendChild(pill);
    section.appendChild(row);

    const memoWrap = document.createElement("div");
    memoWrap.className = "carried-memo";
    const memoInp = document.createElement("input");
    memoInp.placeholder = "메모..."; memoInp.value = t.memo || "";
    memoInp.addEventListener("input", () => { t.memo = memoInp.value; saveData(data); });
    memoWrap.appendChild(memoInp);
    section.appendChild(memoWrap);
    section.appendChild(makeSubtasks(dk, t));
  });
  return section;
}

function makeTaskRow(dk, task) {
  const row = document.createElement("div");
  row.className = "task-row";
  row.draggable = true;
  row.addEventListener("dragstart", () => { dragTaskId = task.id; dragFromDk = dk; });
  row.addEventListener("dragend", () => { dragTaskId = null; dragFromDk = null; });

  const main = document.createElement("div");
  main.className = "task-main";

  const handle = document.createElement("span");
  handle.className = "drag-handle"; handle.textContent = "⋮⋮";

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = task.status === "done";
  cb.style.cssText = "width:14px;height:14px;cursor:pointer;accent-color:#6366f1;flex-shrink:0";

  const textEl = document.createElement("span");
  textEl.className = "task-text" + (task.status === "done" ? " done" : "");
  textEl.textContent = task.text; textEl.title = "더블클릭으로 수정";
  textEl.addEventListener("dblclick", () => {
    textEl.contentEditable = "true"; textEl.focus();
    const finish = () => {
      textEl.contentEditable = "false";
      const v = textEl.textContent.trim();
      if (v) { task.text = v; saveData(data); } else textEl.textContent = task.text;
    };
    textEl.addEventListener("blur", finish, {once: true});
    textEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); textEl.blur(); } }, {once: true});
  });

  cb.addEventListener("change", () => {
    task.status = cb.checked ? "done" : "todo";
    textEl.className = "task-text" + (task.status === "done" ? " done" : "");
    saveData(data);
  });

  const pill = makeStatusPill(task.status, v => {
    task.status = v;
    textEl.className = "task-text" + (task.status === "done" ? " done" : "");
    cb.checked = task.status === "done";
    saveData(data);
  });

  const del = document.createElement("button");
  del.className = "del-btn"; del.textContent = "✕";
  del.addEventListener("click", () => {
    if (data[dk]) data[dk].tasks = data[dk].tasks.filter(t => t.id !== task.id);
    saveData(data); row.remove();
  });

  main.appendChild(handle); main.appendChild(cb);
  if (task.product) {
    const prodEl = document.createElement("span");
    prodEl.className = "task-product"; prodEl.textContent = task.product;
    main.appendChild(prodEl);
  }
  main.appendChild(textEl); main.appendChild(pill); main.appendChild(del);
  row.appendChild(main);

  const memoWrap = document.createElement("div");
  memoWrap.className = "task-memo";
  const memoInp = document.createElement("input");
  memoInp.placeholder = "메모..."; memoInp.value = task.memo || "";
  memoInp.addEventListener("input", () => { task.memo = memoInp.value; saveData(data); });
  memoWrap.appendChild(memoInp);
  row.appendChild(memoWrap);
  row.appendChild(makeSubtasks(dk, task));
  return row;
}

function makeDayCard(dk, i) {
  const dayData = data[dk] || { tasks: [], memo: "" };
  const tasks = dayData.tasks || [];
  const dayOff = dayData.dayOff || "";
  const isToday = dk === todayKey();
  const isDisabled = !!dayOff;
  const done = tasks.filter(t => t.status === "done").length;

  const card = document.createElement("div");
  card.className = "day-card" + (isToday ? " today" : "") + (isDisabled ? " disabled" : "");

  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("dragover"); });
  card.addEventListener("dragleave", e => { if (!card.contains(e.relatedTarget)) card.classList.remove("dragover"); });
  card.addEventListener("drop", () => {
    card.classList.remove("dragover");
    if (!dragTaskId || dragFromDk === dk) return;
    const fromDay = data[dragFromDk];
    if (!fromDay) return;
    const task = (fromDay.tasks || []).find(t => t.id === dragTaskId);
    if (!task) return;
    data[dragFromDk].tasks = (fromDay.tasks || []).filter(t => t.id !== dragTaskId);
    if (!data[dk]) data[dk] = { tasks: [], memo: "" };
    data[dk].tasks.push({...task, _carried: false, _from: undefined});
    saveData(data); render();
  });

  // 헤더
  const hdr = document.createElement("div");
  hdr.className = "day-header" + (isToday ? " today-hdr" : "");
  hdr.style.pointerEvents = "auto";

  const titleEl = document.createElement("span");
  titleEl.className = "day-title";
  titleEl.textContent = DAY_LABELS[i] + "  " + dk.slice(5).replace("-", "/");
  hdr.appendChild(titleEl);

  if (!isDisabled && tasks.length > 0) {
    const badge = document.createElement("span");
    badge.className = "day-badge";
    badge.textContent = done + "/" + tasks.length;
    hdr.appendChild(badge);
  }

  if (isDisabled) {
    const offBadge = document.createElement("span");
    offBadge.className = "day-off-badge";
    offBadge.textContent = dayOff;
    hdr.appendChild(offBadge);
  }

  // 휴가 버튼
  const vacBtn = document.createElement("button");
  vacBtn.className = "vacation-btn";
  vacBtn.style.marginLeft = isDisabled ? "" : "auto";
  vacBtn.textContent = isDisabled ? "✕ 해제" : "휴가";
  vacBtn.addEventListener("click", e => {
    e.stopPropagation();
    if (!data[dk]) data[dk] = { tasks: [], memo: "" };
    if (isDisabled) {
      data[dk].dayOff = "";
      saveData(data); render();
    } else {
      const inp = document.createElement("input");
      inp.className = "vacation-input";
      inp.placeholder = "연차 / 공휴일...";
      vacBtn.replaceWith(inp); inp.focus();
      const commit = () => {
        if (!data[dk]) data[dk] = { tasks: [], memo: "" };
        data[dk].dayOff = inp.value.trim() || "연차";
        saveData(data); render();
      };
      inp.addEventListener("blur", commit);
      inp.addEventListener("keydown", e2 => {
        if (e2.key === "Enter") { e2.preventDefault(); inp.blur(); }
        if (e2.key === "Escape") render();
      });
    }
  });
  hdr.appendChild(vacBtn);
  card.appendChild(hdr);

  if (!isDisabled) {
    const carried = tasks.filter(t => t._carried);
    const normal = tasks.filter(t => !t._carried);
    const carriedSection = makeCarriedSection(dk, carried);
    if (carriedSection) card.appendChild(carriedSection);
    normal.forEach(t => card.appendChild(makeTaskRow(dk, t)));

    // 업무 추가
    const addWrap = document.createElement("div");
    const form = document.createElement("div");
    form.className = "add-form";

    const sel = document.createElement("select");
    ["DEX","H3","BOOM","Platform","etc."].forEach(p => {
      const o = document.createElement("option"); o.value = p; o.textContent = p; sel.appendChild(o);
    });

    const inp = document.createElement("input");
    inp.placeholder = "업무 입력 후 엔터...";

    let formStatus = "todo";
    const formPill = makeStatusPill(formStatus, v => { formStatus = v; });

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel-btn"; cancelBtn.textContent = "✕";
    cancelBtn.addEventListener("click", () => { form.classList.remove("open"); addBtn.style.display = ""; inp.value = ""; });

    const submit = () => {
      const txt = inp.value.trim();
      if (!txt) return;
      if (!data[dk]) data[dk] = { tasks: [], memo: "" };
      const task = { id: uid(), text: txt, product: sel.value, status: formStatus, done: false, memo: "", subs: [] };
      data[dk].tasks.push(task);
      saveData(data);
      card.insertBefore(makeTaskRow(dk, task), addWrap);
      const allT = data[dk].tasks;
      const doneCnt = allT.filter(t => t.status === "done").length;
      let badge = hdr.querySelector(".day-badge");
      if (!badge) { badge = document.createElement("span"); badge.className = "day-badge"; titleEl.after(badge); }
      badge.textContent = doneCnt + "/" + allT.length;
      inp.value = ""; formStatus = "todo";
      form.classList.remove("open"); addBtn.style.display = "";
    };

    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
      if (e.key === "Escape") { form.classList.remove("open"); addBtn.style.display = ""; inp.value = ""; }
    });

    form.appendChild(sel); form.appendChild(inp); form.appendChild(formPill); form.appendChild(cancelBtn);

    const addBtn = document.createElement("button");
    addBtn.className = "add-row-btn"; addBtn.textContent = "+ 업무 추가";
    addBtn.addEventListener("click", () => {
      addBtn.style.display = "none";
      form.classList.add("open");
      setTimeout(() => inp.focus(), 0);
    });

    addWrap.appendChild(form); addWrap.appendChild(addBtn);
    card.appendChild(addWrap);
  }

  return card;
}

function render() {
  const days = getWeekDays(weekBase);
  document.getElementById("weekLabel").textContent =
    days[0].slice(5).replace("-", "/") + " – " + days[4].slice(5).replace("-", "/");
  const board = document.getElementById("board");
  board.innerHTML = "";
  days.forEach((dk, i) => board.appendChild(makeDayCard(dk, i)));
}

document.getElementById("prevBtn").addEventListener("click", () => {
  const d = new Date(getWeekDays(weekBase)[0] + "T00:00:00");
  d.setDate(d.getDate() - 7); weekBase = toKey(d); render();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  const d = new Date(getWeekDays(weekBase)[0] + "T00:00:00");
  d.setDate(d.getDate() + 7); weekBase = toKey(d); render();
});
document.getElementById("todayBtn").addEventListener("click", () => { weekBase = todayKey(); render(); });

carryOver();
render();
</script>
</body>
</html>
